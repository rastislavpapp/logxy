[versions]
kotlin = "2.4.21"
# The IntelliJ plugin uses the IDE's copy, 1.10.2 in 2026.1 and 2026.2; 1.11 is not binary compatible with it.
kotlinx-coroutines = "1.10.2"
flatlaf = "3.7.2"
junit = "6.1.3"
slf4j = "2.0.20"
log4j = "2.26.1"
# 2.x is the first line built on the Kotlin 2 compiler; 1.23 cannot analyse this code.
detekt = "2.0.0-alpha.6"
jmh = "1.37"
intellij-platform = "2.19.0"
# The IDE the plugin compiles against: the oldest it supports.
intellij-idea = "2026.1.5"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
flatlaf-intellij-themes = { module = "com.formdev:flatlaf-intellij-themes", version.ref = "flatlaf" }
flatlaf-fonts-inter = { module = "com.formdev:flatlaf-fonts-inter", version = "4.1" }
flatlaf-fonts-jetbrains-mono = { module = "com.formdev:flatlaf-fonts-jetbrains-mono", version = "2.304" }
miglayout-swing = { module = "com.miglayout:miglayout-swing", version = "11.5.1" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version = "4.0.1" }
autocomplete = { module = "com.fifesoft:autocomplete", version = "4.0.0" }
intellij-icons = { module = "com.jetbrains.intellij.platform:icons", version = "262.10968.176" }
# Same version FlatLaf uses for SVG icons.
jsvg = { module = "com.github.weisj:jsvg", version = "2.2.0" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
zstd-jni = { module = "com.github.luben:zstd-jni", version = "1.5.7-23" }
intellij-platform-gradle-plugin = { module = "org.jetbrains.intellij.platform:intellij-platform-gradle-plugin", version.ref = "intellij-platform" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-rules-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
# Benchmarks in tools: forks, warm-up and per-fork results.
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
