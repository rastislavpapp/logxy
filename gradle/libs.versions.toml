[versions]
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
flatlaf = "3.7.2"
junit = "6.1.3"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
flatlaf-intellij-themes = { module = "com.formdev:flatlaf-intellij-themes", version.ref = "flatlaf" }
flatlaf-fonts-inter = { module = "com.formdev:flatlaf-fonts-inter", version = "4.1" }
flatlaf-fonts-jetbrains-mono = { module = "com.formdev:flatlaf-fonts-jetbrains-mono", version = "2.304" }
miglayout-swing = { module = "com.miglayout:miglayout-swing", version = "11.5.1" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version = "4.0.1" }
autocomplete = { module = "com.fifesoft:autocomplete", version = "4.0.0" }
intellij-icons = { module = "com.jetbrains.intellij.platform:icons", version = "262.10968.176" }
# Same version FlatLaf uses for SVG icons.
jsvg = { module = "com.github.weisj:jsvg", version = "2.1.0" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
