version=0.1.0-SNAPSHOT
org.gradle.configuration-cache=true
org.gradle.caching=false
org.gradle.parallel=true
# detekt runs in the daemon, and with the default 512 MB the daemon dies of GC thrashing.
org.gradle.jvmargs=-Xmx2g
# JMH's annotation processor (tools) is not incremental, and incremental kapt warns about its output.
kapt.incremental.apt=false
