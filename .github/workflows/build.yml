name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

# The plugin builds against an unpacked IDE of about 4 GB, kept in .intellijPlatform/ides. The latest release that
# verifyPlugin also checks is not part of the key, so a new one is downloaded until the version catalog changes.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v5
        with:
          path: .intellijPlatform/ides
          key: ides-${{ runner.os }}-build-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew build

  verify-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v5
        with:
          path: .intellijPlatform/ides
          key: ides-${{ runner.os }}-verify-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :plugin:verifyPlugin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-verifier
          path: plugin/build/reports/pluginVerifier/
          if-no-files-found: ignore
