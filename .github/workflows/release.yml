name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # Dry run: builds every package but publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the packages
        default: 0.0.0

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            version=$GITHUB_REF_NAME
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          else
            version=$INPUT_VERSION
          fi
          # jpackage only accepts numeric versions.
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$version' is not MAJOR.MINOR.PATCH"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  package:
    needs: [check, build]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -Pversion="$VERSION" :app:nativeArchive
      # The plugin zip is the same on every OS, so only Linux builds it.
      - if: runner.os == 'Linux'
        run: ./gradlew -Pversion="$VERSION" :plugin:buildPlugin
      - name: Collect packages
        run: |
          mkdir dist
          cp app/build/dist/* dist/
          if [[ $RUNNER_OS == Linux ]]; then
            cp app/build/libs/logxy.jar "dist/logxy-$VERSION.jar"
            cp "plugin/build/distributions/plugin-$VERSION.zip" "dist/logxy-intellij-plugin-$VERSION.zip"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "logxy $VERSION" --generate-notes
