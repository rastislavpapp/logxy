name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # Dry run: builds every package but publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the packages
        default: 0.0.0

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish-plugin: ${{ steps.changelog.outputs.publish-plugin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            version=$GITHUB_REF_NAME
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          else
            version=$INPUT_VERSION
          fi
          # jpackage only accepts numeric versions.
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$version' is not MAJOR.MINOR.PATCH"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: github.event_name == 'push'
        uses: gradle/actions/setup-gradle@v6
      # A tag needs a section in the plugin's changelog, which patchChangelog makes. Without entries, the tag changed
      # nothing in the plugin, so JetBrains Marketplace gets no new version; the zip still goes on the GitHub release.
      - id: changelog
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(./gradlew -q :logxy-intellij-plugin:getChangelog --project-version="$VERSION" \
            --no-header --no-summary --no-links --no-empty-sections) \
            || { echo "::error::logxy-intellij-plugin/CHANGELOG.md has no $VERSION section"; exit 1; }
          [[ -n ${notes//[[:space:]]/} ]] && publish=true || publish=false
          echo "publish-plugin=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  package:
    needs: [check, build]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -Pversion="$VERSION" :app:nativeArchive
      # The plugin zip is the same on every OS, so only Linux builds it.
      - if: runner.os == 'Linux'
        run: ./gradlew -Pversion="$VERSION" :logxy-intellij-plugin:buildPlugin
      - name: Collect packages
        run: |
          mkdir dist
          cp app/build/dist/* dist/
          if [[ $RUNNER_OS == Linux ]]; then
            cp app/build/libs/logxy.jar "dist/logxy-$VERSION.jar"
            cp "logxy-intellij-plugin/build/distributions/logxy-intellij-plugin-$VERSION.zip" dist/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "logxy $VERSION" --generate-notes

  publish-plugin:
    if: github.event_name == 'push' && needs.check.outputs.publish-plugin == 'true'
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - env:
          VERSION: ${{ needs.check.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          # Marketplace takes a new plugin's first version only by hand, so the token is added after that upload.
          if [[ -z $PUBLISH_TOKEN ]]; then
            echo "::notice::No PUBLISH_TOKEN secret: $VERSION is not published to JetBrains Marketplace"
            exit 0
          fi
          ./gradlew -Pversion="$VERSION" :logxy-intellij-plugin:publishPlugin
