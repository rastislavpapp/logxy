name: Plugin vs IntelliJ EAP

# The latest EAP, weekly rather than on every push: it warns of an IDE change months ahead, and an EAP may break what
# its release will fix, so it must not block a build.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-plugin:
    uses: ./.github/workflows/verify-plugin.yml
    with:
      eap: true
