name: Bug report
description: Something does not work as expected
labels: [needs-triage]
body:
  - type: dropdown
    id: product
    attributes:
      label: Where
      options:
        - App
        - IntelliJ plugin
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Log sample
      description: A few lines of the file or the run's output that trigger the problem, with anything private removed. Optional.
      render: text
  - type: input
    id: version
    attributes:
      label: logxy version
      description: "App: Help › About. Plugin: Settings › Plugins › Installed › logxy."
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Java version (app) or IDE and its version (plugin)
      placeholder: Temurin 25.0.4 / IntelliJ IDEA 2026.2.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Fedora 44
    validations:
      required: true
