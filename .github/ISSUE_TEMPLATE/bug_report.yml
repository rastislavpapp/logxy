name: Bug report
description: Something does not work as expected
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Log sample
      description: A few lines of the file that trigger the problem, with anything private removed. Optional.
      render: text
  - type: input
    id: version
    attributes:
      label: logxy version
      description: Help › About
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Java version
      placeholder: Fedora 44, Temurin 25.0.4
    validations:
      required: true
