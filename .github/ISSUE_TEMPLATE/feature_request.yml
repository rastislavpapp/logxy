name: Feature request
description: Suggest an improvement
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that logxy makes hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like logxy to do? Alternatives you considered are welcome.
